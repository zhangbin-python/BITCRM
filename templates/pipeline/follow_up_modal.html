<div class="modal fade" id="followupModal{{ pipeline.id }}" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ _('Add Follow-up') }} - {{ pipeline.company or pipeline.name }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form action="{{ url_for('pipeline.add_followup', pipeline_id=pipeline.id) }}" method="POST">
                <div class="modal-body">
                    {% set stage_options = pipeline.STAGE_OPTIONS %}
                    {% include 'pipeline/_followup_form.html' %}
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ _('Cancel') }}</button>
                    <button type="submit" class="btn btn-success">{{ _('Save Follow-up') }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
