{% if pipeline.follow_up %}
<div class="mb-4">
    <label class="form-label small text-muted mb-1"><i class="fas fa-history me-1"></i>{{ _('Follow-up History') }}</label>
    <textarea class="form-control bg-light" rows="10" readonly style="resize: vertical; font-size: 0.875rem; max-height: 300px; overflow-y: auto;">{{ pipeline.follow_up }}</textarea>
</div>
{% endif %}
<input type="hidden" name="pipeline_id" value="{{ pipeline.id }}">
{% include 'shared/_followup_activity_fields.html' %}
<div class="row g-3">
    <div class="col-md-6">
        <label class="form-label">{{ _('Current Stuckpoint') }}</label>
        <textarea name="stuckpoint_text" class="form-control" rows="2" placeholder="{{ _('What is blocking progress?') }}">{{ pipeline.stuckpoint or '' }}</textarea>
    </div>
    <div class="col-md-6">
        <label class="form-label">{{ _('Current Stage') }}</label>
        <select name="stage" class="form-select">
            {% for stage in stage_options %}<option value="{{ stage }}" {% if stage == pipeline.stage %}selected{% endif %}>{{ _(stage) }}</option>{% endfor %}
        </select>
    </div>
</div>
